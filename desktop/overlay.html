<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>快捷录音</title>
<style>
  * { box-sizing: border-box; user-select: none; }
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; font-family: "Microsoft YaHei", system-ui, sans-serif; }
  body { -webkit-app-region: drag; }
  .wrap { width: 200px; padding: 6px; display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .bubble { max-width: 190px; background: rgba(13,20,28,.94); color: #dbe7f3; border: 1px solid rgba(90,170,255,.45); border-radius: 12px; padding: 7px 10px; font-size: 12px; line-height: 1.35; box-shadow: 0 6px 20px rgba(0,0,0,.4); display: none; white-space: pre-wrap; word-break: break-all; }
  .bubble.show { display: block; }
  .bubble .who { color: #7fb2ff; font-size: 11px; display: block; margin-bottom: 2px; }
  .orb { -webkit-app-region: no-drag; width: 84px; height: 84px; border-radius: 50%; border: 2px solid rgba(120,190,255,.6); background: radial-gradient(circle at 35% 30%, #1d6fd8, #0b2b55 70%); color: #fff; font-size: 11px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; box-shadow: 0 8px 24px rgba(0,0,0,.45); transition: transform .12s ease, box-shadow .2s ease, background .2s ease; }
  .orb:hover { transform: scale(1.04); }
  .orb .ico { font-size: 26px; line-height: 1; }
  .orb .txt { font-size: 10px; opacity: .9; }
  .orb.idle { border-color: rgba(130,200,255,.55); }
  .orb.listening { background: radial-gradient(circle at 35% 30%, #e04848, #6b1111 70%); border-color: rgba(255,120,120,.9); animation: pulse 1.1s infinite; }
  .orb.thinking { background: radial-gradient(circle at 35% 30%, #d2902a, #5c3a08 70%); border-color: rgba(255,200,100,.9); }
  .orb.speaking { background: radial-gradient(circle at 35% 30%, #1f9e6e, #08402c 70%); border-color: rgba(90,240,180,.9); }
  .orb.err { background: radial-gradient(circle at 35% 30%, #8a8a8a, #3a3a3a 70%); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,80,80,.55); } 70% { box-shadow: 0 0 0 16px rgba(255,80,80,0); } 100% { box-shadow: 0 0 0 0 rgba(255,80,80,0); } }
  .tip { font-size: 10px; color: rgba(220,235,250,.65); text-align: center; -webkit-app-region: no-drag; }
  .close { position: absolute; right: 6px; top: 2px; -webkit-app-region: no-drag; background: transparent; border: 0; color: rgba(220,235,250,.5); font-size: 12px; cursor: pointer; }
  .close:hover { color: #fff; }
</style>
</head>
<body>
<div class="wrap">
  <button class="close" id="close" title="隐藏悬浮按钮（托盘可重新显示）">✕</button>
  <div class="bubble" id="bubble"><span class="who" id="who">你说</span><span id="bubble-text"></span></div>
  <div class="orb idle" id="orb" title="点一下开始录音（说一句直接执行）">
    <span class="ico" id="ico">🎙</span>
    <span class="txt" id="txt">点我说话</span>
  </div>
  <div class="tip" id="tip">提示：说「把音量调到六十」「打开记事本」</div>
</div>
<script>
(function () {
  var orb = document.getElementById('orb');
  var ico = document.getElementById('ico');
  var txt = document.getElementById('txt');
  var tip = document.getElementById('tip');
  var bubble = document.getElementById('bubble');
  var who = document.getElementById('who');
  var bubbleText = document.getElementById('bubble-text');
  var close = document.getElementById('close');
  var state = { phase: 'idle', said: '', reply: '' };
  var hideTimer = null;
  function render() {
    var phase = state.phase || 'idle';
    orb.className = 'orb ' + phase;
    if (phase === 'listening') { ico.textContent = '🔴'; txt.textContent = '正在听…'; tip.textContent = '说完自动执行；再点一次取消'; }
    else if (phase === 'thinking') { ico.textContent = '⏳'; txt.textContent = '理解中…'; tip.textContent = 'AI 正在理解并执行'; }
    else if (phase === 'speaking') { ico.textContent = '🔊'; txt.textContent = '已执行'; tip.textContent = '点我再说一句'; }
    else if (phase === 'err') { ico.textContent = '⚠'; txt.textContent = '出错了'; tip.textContent = '点我重试'; }
    else { ico.textContent = '🎙'; txt.textContent = '点我说话'; tip.textContent = '提示：说「把音量调到六十」「打开记事本」'; }
    var said = (state.said || '').trim();
    var reply = (state.reply || '').trim();
    if (phase === 'listening' && said) { who.textContent = '听到'; bubbleText.textContent = said; bubble.classList.add('show'); }
    else if (reply) { who.textContent = '榫卯'; bubbleText.textContent = reply; bubble.classList.add('show'); }
    else if (said && phase !== 'listening') { who.textContent = '你说'; bubbleText.textContent = said; bubble.classList.add('show'); }
    else { bubble.classList.remove('show'); }
  }
  function apply(s) {
    if (!s) return;
    if (s.phase) state.phase = s.phase;
    if (typeof s.said === 'string') state.said = s.said;
    if (typeof s.reply === 'string') state.reply = s.reply;
    render();
  }
  orb.addEventListener('click', function () { if (window.tenonQuick && window.tenonQuick.toggle) window.tenonQuick.toggle(); });
  close.addEventListener('click', function (e) { e.stopPropagation(); if (window.tenonQuick && window.tenonQuick.hide) window.tenonQuick.hide(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && window.tenonQuick && window.tenonQuick.hide) window.tenonQuick.hide(); });
  if (window.tenonQuick && window.tenonQuick.onStatus) window.tenonQuick.onStatus(apply);
  if (window.tenonQuick && window.tenonQuick.getStatus) window.tenonQuick.getStatus().then(apply).catch(function(){});
  render();
})();
</script>
</body>
</html>
