<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#070B14">
  <meta name="description" content="榫卯 Tenon · 手机遥控电脑：触控板、键盘、媒体键、一键启动程序">
  <title>榫卯 Tenon · 手机遥控电脑</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/style-v2.css">
</head>
<body class="m-body" data-page="remote">
  <div class="m-shell" id="remote-root">
    <header class="m-head">
      <div class="m-brand">
        <span class="brand-mark" aria-hidden="true">榫</span>
        <span>遥控电脑<small>TENON · 手机触控板</small></span>
      </div>
      <div class="m-header-right">
        <a class="m-link" href="/m">← 手机页</a>
        <span class="m-asof" id="remote-asof">连接中…</span>
      </div>
    </header>

    <div class="offline-banner hidden" id="remote-offline" data-testid="m-remote-offline">离线：无法连接中枢</div>

    <section class="m-card">
      <h2>连接状态 <span class="count mono" id="remote-latency" data-testid="m-remote-latency">—</span></h2>
      <div class="form-row">
        <div class="field" style="flex:1">
          <label style="font-size:11px;color:var(--muted)">要控制的电脑</label>
          <select id="remote-device" data-testid="m-remote-device"></select>
        </div>
        <button class="btn btn-sm" data-remotectl="refresh" data-testid="m-remote-refresh">刷新</button>
      </div>
      <div class="tiny dim" id="remote-status" data-testid="m-remote-status" style="margin-top:6px">选择一个已绑定、在线的电脑</div>
      <div class="tiny dim" id="remote-hint" style="margin-top:4px">手机与电脑同一 WiFi；首次遥控需要一次操作令牌（电脑端启动日志里那个）。</div>
    </section>

    <section class="m-card hidden" id="remote-token-card">
      <h2>输入操作令牌 <span class="count">一次就好</span></h2>
      <div class="form-row" style="margin-top:8px">
        <div class="field" style="flex:1"><input type="password" id="remote-token-input" data-testid="m-remote-token-input" placeholder="operatorToken" autocomplete="off" spellcheck="false"></div>
        <button class="btn btn-primary" data-remotectl="save-token" data-testid="m-remote-token-save">保存</button>
      </div>
      <div class="form-error" id="remote-token-error"></div>
    </section>

    <section class="m-card">
      <h2>触控板 <span class="count" id="remote-pad-state">单指移动 · 轻点左键 · 双指滚动</span></h2>
      <div class="m-touchpad" id="remote-pad" data-testid="m-remote-pad" tabindex="0" role="application" aria-label="触控板：单指移动，轻点左键，双指滚动">
        <div class="m-touchpad-dot" aria-hidden="true"></div>
        <div class="m-touchpad-hint">在这里滑动 = 移动电脑鼠标</div>
      </div>
      <div class="m-row" style="margin-top:8px;gap:6px;flex-wrap:wrap">
        <button class="btn btn-sm" data-remotectl="click" data-button="left" data-testid="m-remote-left-click">左键</button>
        <button class="btn btn-sm" data-remotectl="click" data-button="right" data-testid="m-remote-right-click">右键</button>
        <button class="btn btn-sm" data-remotectl="wheel" data-delta="120" data-testid="m-remote-wheel-down">向下滚</button>
        <button class="btn btn-sm" data-remotectl="wheel" data-delta="-120" data-testid="m-remote-wheel-up">向上滚</button>
      </div>
    </section>

    <section class="m-card">
      <h2>键盘 <span class="count">文字 + 常用键</span></h2>
      <div class="form-row">
        <div class="field" style="flex:1"><input type="text" id="remote-text" data-testid="m-remote-text" placeholder="输入要发到电脑的文字（中文也可）" maxlength="500"></div>
        <button class="btn btn-primary" data-remotectl="send-text" data-testid="m-remote-send-text">发送</button>
      </div>
      <div class="m-key-grid" style="margin-top:8px">
        <button class="m-key" data-remotectl="combo" data-combo="enter" data-testid="m-remote-key-enter">Enter</button>
        <button class="m-key" data-remotectl="combo" data-combo="esc" data-testid="m-remote-key-esc">Esc</button>
        <button class="m-key" data-remotectl="combo" data-combo="tab" data-testid="m-remote-key-tab">Tab</button>
        <button class="m-key" data-remotectl="combo" data-combo="backspace" data-testid="m-remote-key-backspace">⌫</button>
        <button class="m-key" data-remotectl="combo" data-combo="ctrl+a" data-testid="m-remote-key-ctrl-a">Ctrl+A</button>
        <button class="m-key" data-remotectl="combo" data-combo="ctrl+c" data-testid="m-remote-key-ctrl-c">Ctrl+C</button>
        <button class="m-key" data-remotectl="combo" data-combo="ctrl+v" data-testid="m-remote-key-ctrl-v">Ctrl+V</button>
        <button class="m-key" data-remotectl="combo" data-combo="ctrl+s" data-testid="m-remote-key-ctrl-s">Ctrl+S</button>
        <button class="m-key" data-remotectl="combo" data-combo="alt+tab" data-testid="m-remote-key-alt-tab">Alt+Tab</button>
        <button class="m-key" data-remotectl="combo" data-combo="up" data-testid="m-remote-key-up">↑</button>
        <button class="m-key" data-remotectl="combo" data-combo="down" data-testid="m-remote-key-down">↓</button>
        <button class="m-key" data-remotectl="combo" data-combo="left" data-testid="m-remote-key-left">←</button>
        <button class="m-key" data-remotectl="combo" data-combo="right" data-testid="m-remote-key-right">→</button>
      </div>
    </section>

    <section class="m-card">
      <h2>媒体与音量</h2>
      <div class="m-row" style="gap:6px;flex-wrap:wrap">
        <button class="btn btn-sm" data-remotectl="media" data-media="play-pause" data-testid="m-remote-media-play">⏯ 播放/暂停</button>
        <button class="btn btn-sm" data-remotectl="media" data-media="prev" data-testid="m-remote-media-prev">⏮ 上一曲</button>
        <button class="btn btn-sm" data-remotectl="media" data-media="next" data-testid="m-remote-media-next">⏭ 下一曲</button>
        <button class="btn btn-sm" data-remotectl="media" data-media="mute" data-testid="m-remote-media-mute">🔇 静音</button>
        <button class="btn btn-sm" data-remotectl="media" data-media="vol-up" data-testid="m-remote-media-vol-up">🔊 音量+</button>
        <button class="btn btn-sm" data-remotectl="media" data-media="vol-down" data-testid="m-remote-media-vol-down">🔉 音量−</button>
      </div>
    </section>

    <section class="m-card">
      <h2>常用程序 <span class="count">一键启动</span></h2>
      <div class="m-row" style="gap:6px;flex-wrap:wrap" id="remote-apps" data-testid="m-remote-apps">
        <button class="btn btn-sm" data-remotectl="app" data-app="微信" data-testid="m-remote-app-wechat">微信</button>
        <button class="btn btn-sm" data-remotectl="app" data-app="chrome" data-testid="m-remote-app-chrome">Chrome</button>
        <button class="btn btn-sm" data-remotectl="app" data-app="notepad" data-testid="m-remote-app-notepad">记事本</button>
        <button class="btn btn-sm" data-remotectl="app" data-app="explorer" data-testid="m-remote-app-explorer">资源管理器</button>
        <button class="btn btn-sm" data-remotectl="app" data-app="calc" data-testid="m-remote-app-calc">计算器</button>
        <button class="btn btn-sm" data-remotectl="app" data-app="terminal" data-testid="m-remote-app-terminal">终端</button>
      </div>
    </section>

    <div class="m-card" style="text-align:center">
      <a class="m-link" href="/m/link">← 互联 / 配对</a>　<a class="m-link" href="/m">手机页</a>
    </div>
    <div class="m-foot">榫卯 Tenon v3 · 手机遥控：只在同一 WiFi 内生效 · 遥控动作会写账本</div>
  </div>
  <div class="m-toast-root" id="m-toast"></div>
  <script src="/m-remote.js"></script>
</body>
</html>
