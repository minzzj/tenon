plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.minzzj.tenon'
    compileSdk 34

    defaultConfig {
        applicationId "com.minzzj.tenon"
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName "0.6.5"

        // 默认中枢地址 / 操作令牌：从 local.properties 读取（该文件已 .gitignore，不随仓库分发）
        // 手机首次打开即可直接连上本机 hub；用户可在「设置」里修改。
        def lp = new Properties()
        def lpFile = rootProject.file("local.properties")
        if (lpFile.exists()) {
            lpFile.withInputStream { lp.load(it) }
        }
        def defaultHub = lp.getProperty("tenon.defaultHub", "http://192.168.3.123:7410")
        def defaultToken = lp.getProperty("tenon.defaultToken", "")
        buildConfigField "String", "DEFAULT_HUB", "\"${defaultHub}\""
        buildConfigField "String", "DEFAULT_TOKEN", "\"${defaultToken}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        buildConfig true
    }
    packagingOptions {
        resources.excludes += ['META-INF/*.kotlin_module']
    }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
    // V5：FileProvider（文档分享）+ WorkManager（提醒后台兜底轮询）
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
}