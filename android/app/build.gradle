plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.minzzj.tenon'
    compileSdk 34

    defaultConfig {
        applicationId "com.minzzj.tenon"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "0.2.0"

        // 默认中枢地址由 App 内设置覆盖；这里只放一个占位说明
        buildConfigField "String", "DEFAULT_HUB", "\"\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        buildConfig true
    }
    packagingOptions {
        resources.excludes += ['META-INF/*.kotlin_module']
    }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
}