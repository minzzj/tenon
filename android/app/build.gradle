plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.minzzj.tenon'
    compileSdk 34

    defaultConfig {
        applicationId "com.minzzj.tenon"
        minSdk 26
        targetSdk 34
        versionCode 12
        versionName "0.6.10"

        // 0.6.8：公开分发的 APK 不内置中枢地址、不内置操作令牌。
        // 首次安装请在「设置 → 中枢连接」选择局域网/公网地址并填写 operatorToken；
        // 升级安装会保留已保存的地址与令牌，不受影响。
        def defaultHub = ""
        def defaultToken = ""
        buildConfigField "String", "DEFAULT_HUB", "\"${defaultHub}\""
        buildConfigField "String", "DEFAULT_TOKEN", "\"${defaultToken}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        buildConfig true
    }
    packagingOptions {
        resources.excludes += ['META-INF/*.kotlin_module']
    }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
    // V5：FileProvider（文档分享）+ WorkManager（提醒后台兜底轮询）
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
}